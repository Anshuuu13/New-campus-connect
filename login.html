<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusConnect — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="wordmark auth-brand">
        <span class="seal">CC</span>
        <span class="name">CampusConnect</span>
      </div>
      <p class="sub">Sign in to see what's happening on campus.</p>

      <form id="loginForm">
        <label class="field-label" for="nameInput">Name</label>
        <input class="field-input" type="text" id="nameInput" placeholder="e.g. Anshika Sharma" required>
<div id="extraFields">
        <label class="field-label" for="deptInput">Department</label>
        <input class="field-input" type="text" id="deptInput" placeholder="e.g. Computer Science">

        <label class="field-label" for="roleInput">I am a</label>
        <select class="field-input" id="roleInput">
          <option value="Student">Student</option>
          <option value="Senior">Senior</option>
          <option value="Professor">Professor</option>
        </select> </div>
         <label class="field-label" for="passwordInput">Password</label>
<input class="field-input" type="password" id="passwordInput" placeholder="Enter a password" required>

        <button type="submit" class="btn btn-primary auth-submit">Continue</button>
      </form> <p class="sub" style="margin-top: 12px; text-align: center;">
  <span id="toggleText">Already have an account?</span>
  <a href="#" id="toggleLink">Log In</a>
</p>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
