<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusConnect — Research Collaboration &amp; Lab Openings | MITS Gwalior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .module-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
  }
  .action-controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    background: #0d1f44;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #1e3a70;
  }
  .search-box-wrap {
    flex: 1 1 240px;
  }
  .filter-select {
    padding: 10px 14px;
    background: #081329;
    color: #e2e8f0;
    border: 1px solid #1e3a70;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .form-panel-card {
    background: #0d1f44;
    border: 1px solid #2563eb;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .category-badge-pill {
    background: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .applicant-count-pill {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
  }
  .applicants-drawer {
    background: #081329;
    border: 1px solid #1e3a70;
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 12px;
  }
  .btn-sm {
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
  }
  .btn-edit {
    background: #0284c7;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  .btn-edit:hover {
    background: #0369a1;
  }
  .btn-danger {
    background: #dc2626;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  .btn-danger:hover {
    background: #b91c1c;
  }
</style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="wordmark" style="text-decoration:none; color:inherit;">
      <span class="seal">CC</span>
      <span class="name">CampusConnect</span>
    </a>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="user-chip">
        <span class="dot"></span>
        <span id="userRole">Faculty / Student</span>
      </div>
      <button id="logoutBtn" class="btn btn-secondary btn-sm" style="display:none;">Sign Out</button>
    </div>
  </header>

  <main class="page">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <div class="rule"></div>

    <div class="module-header">
      <div>
        <h1 style="margin: 0 0 6px 0;">Research Collaboration &amp; Lab Openings</h1>
        <p class="sub" style="margin:0;">Open research assistantships, funded projects, and lab opportunities across MITS Gwalior departments.</p>
      </div>
      <button class="btn btn-primary" id="togglePostFormBtn">+ Post Research Opportunity</button>
    </div>

    <!-- Collapsible Create Research Opportunity Form -->
    <div class="form-panel-card" id="createFormCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0; font-size:18px; color:#38bdf8;">Post Research Opportunity / Lab Opening</h3>
        <button id="closeCreateFormBtn" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">&times;</button>
      </div>

      <div style="display:grid; grid-template-columns: 1fr; gap: 14px;">
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:12px;">
          <div>
            <label class="field-label" for="postTitleInput">Project / Research Title *</label>
            <input class="field-input" type="text" id="postTitleInput" placeholder="e.g. Autonomous Aerial Navigation &amp; Crop Sensing">
          </div>
          <div>
            <label class="field-label" for="categoryInput">Category *</label>
            <select class="field-input" id="categoryInput">
              <option value="Research">Research</option>
              <option value="Technical Work">Technical Work</option>
              <option value="Lab Assistance">Lab Assistance</option>
              <option value="Writing &amp; Publishing">Writing &amp; Publishing</option>
              <option value="Event Support">Event Support</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div>
          <label class="field-label" for="postDescInput">Project Scope &amp; Deliverables *</label>
          <textarea class="field-input" id="postDescInput" rows="3" placeholder="Describe the research goals, datasets, laboratory facilities, and student responsibilities..."></textarea>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div>
            <label class="field-label" for="postSkillsInput">Skills &amp; Prerequisites Needed *</label>
            <input class="field-input" type="text" id="postSkillsInput" placeholder="e.g. Python, OpenCV, ROS2, PyTorch">
          </div>
          <div>
            <label class="field-label" for="postEmailInput">Contact Email *</label>
            <input class="field-input" type="email" id="postEmailInput" placeholder="faculty@mitsgwalior.in">
          </div>
        </div>

        <div>
          <label class="field-label" for="postTimeInput">Discussion / Lab Meeting Hours</label>
          <input class="field-input" type="text" id="postTimeInput" placeholder="e.g. Tuesdays &amp; Thursdays 3:30 PM, Robotics Lab 3">
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
          <button class="btn btn-secondary" id="cancelPostBtn" type="button">Cancel</button>
          <button class="btn btn-primary" id="submitPostBtn" type="button">Publish Opportunity</button>
        </div>
      </div>
    </div>

    <!-- Filter & Search Controls -->
    <div class="action-controls-row">
      <div class="search-box-wrap">
        <input type="text" id="researchSearchInput" class="field-input" placeholder="Search by research topic, skills (e.g. Python, MATLAB, AI, IoT)..." style="margin:0;">
      </div>
      <div>
        <select id="categoryFilterSelect" class="filter-select">
          <option value="All">All Categories</option>
          <option value="Research">Research</option>
          <option value="Technical Work">Technical Work</option>
          <option value="Lab Assistance">Lab Assistance</option>
          <option value="Writing &amp; Publishing">Writing &amp; Publishing</option>
          <option value="Event Support">Event Support</option>
        </select>
      </div>
      <div id="postsCountBadge" style="font-size:13px; color:#94a3b8; margin-left:auto;">
        Loading research opportunities...
      </div>
    </div>

    <!-- Main Research Openings Feed -->
    <section class="post-list" id="postList">
      <!-- rendered by research.js -->
    </section>
  </main>

  <!-- Edit Research Opportunity Modal -->
  <div id="editResearchModal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width:540px; background:#0d1f44; border:1px solid #38bdf8; padding:24px; border-radius:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin:0; font-size:18px; color:#38bdf8;">Edit Research Opportunity</h3>
        <button id="closeEditModalBtn" style="background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <input type="hidden" id="editPostId">

      <div style="display:grid; grid-template-columns: 1fr; gap:12px;">
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:10px;">
          <div>
            <label class="field-label" for="editTitleInput">Title</label>
            <input class="field-input" type="text" id="editTitleInput">
          </div>
          <div>
            <label class="field-label" for="editCategoryInput">Category</label>
            <select class="field-input" id="editCategoryInput">
              <option value="Research">Research</option>
              <option value="Technical Work">Technical Work</option>
              <option value="Lab Assistance">Lab Assistance</option>
              <option value="Writing &amp; Publishing">Writing &amp; Publishing</option>
              <option value="Event Support">Event Support</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div>
          <label class="field-label" for="editDescInput">Description &amp; Scope</label>
          <textarea class="field-input" id="editDescInput" rows="3"></textarea>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div>
            <label class="field-label" for="editSkillsInput">Skills Needed</label>
            <input class="field-input" type="text" id="editSkillsInput">
          </div>
          <div>
            <label class="field-label" for="editEmailInput">Contact Email</label>
            <input class="field-input" type="email" id="editEmailInput">
          </div>
        </div>

        <div>
          <label class="field-label" for="editTimeInput">Discussion Time</label>
          <input class="field-input" type="text" id="editTimeInput">
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
          <button class="btn btn-secondary" id="cancelEditBtn" type="button">Cancel</button>
          <button class="btn btn-primary" id="saveEditBtn" type="button">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="research.js"></script>
</body>
</html>
