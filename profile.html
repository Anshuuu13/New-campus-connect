<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect — Profile | MITS Gwalior</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="wordmark" style="text-decoration:none; color:inherit;">
      <span class="seal">CC</span>
      <span class="name">CampusConnect</span>
    </a>
    <div class="user-chip">
      <span class="dot"></span>
      <span id="userRole">Student</span>
    </div>
  </header>

  <main class="page">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <div class="rule"></div>
    <h1 id="profileName">Profile</h1>
    <p class="sub" id="profileMeta"></p>
    <span id="clubBadge" class="club-badge" style="display:none;"></span>

    <div class="profile-header-extra">
      <img id="profilePic" src="" alt="Profile Picture" class="profile-pic-large">
      <div id="profileEnrollmentBadge" style="display:none; margin: 8px 0;">
        <span style="font-family: var(--mono); font-size: 12px; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 4px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px;">
          🆔 Enrollment No: <strong id="profileEnrollmentText"></strong>
        </span>
      </div>
      <p class="sub" id="profileBio"></p>
      <p class="sub" id="profileBranchYear"></p>
      <div class="social-links" id="profileSocialLinks"></div>
      <button id="editProfileBtn" class="btn" style="margin-top: 10px;">Edit Profile</button>
    </div>

    <div class="skill-block">
      <h3>Skills</h3>
      <div id="profileSkills"></div>
    </div>

    <div class="skill-block">
      <h3>Achievements</h3>
      <div id="profileAchievements"></div>
    </div>

    <div class="skill-block">
      <h3>Public Projects</h3>
      <div id="profileProjects"></div>
    </div> 

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal-overlay" style="display:none;">
      <div class="modal-box">
        <h3>Edit Profile</h3>
        <form id="editProfileForm">
          <label>Full Name</label>
          <input type="text" id="nameInput" placeholder="Full Name">

          <label>Enrollment Number</label>
          <input type="text" id="enrollmentInput" placeholder="e.g. 0901CS211001" style="text-transform: uppercase; font-family: var(--mono);">

          <label>Profile Picture</label>
          <img id="picPreview" src="" alt="" style="width:80px;height:80px;border-radius:50%;object-fit:cover;display:none;margin-bottom:8px;">
          <input type="file" id="picInput" accept="image/*">

          <label>Bio</label>
          <textarea id="bioInput" rows="2"></textarea>

          <label>Branch</label>
          <input type="text" id="branchInput" placeholder="e.g. Computer Science & Engineering">

          <label>Year</label>
          <input type="text" id="yearInput" placeholder="e.g. 2nd Year">

          <label>LinkedIn URL</label>
          <input type="text" id="linkedinInput" placeholder="https://linkedin.com/in/username">

          <label>GitHub URL</label>
          <input type="text" id="githubInput" placeholder="https://github.com/username">

          <label>Contact Email</label>
          <input type="email" id="contactEmailInput" placeholder="name@mitsgwl.ac.in">

          <div class="modal-actions"> 
            <hr style="margin:20px 0; border-color:#444;">
            <label>Request Club Head / President Role</label>
            <input type="text" id="clubNameInput" placeholder="Club name (e.g. Coding Club)">
            <input type="text" id="clubRoleTitleInput" placeholder="Role (e.g. President)" style="margin-top:8px;">
            <button type="button" id="submitClubRequestBtn" class="btn" style="margin-top:10px;">Submit Request</button>
            <p id="clubRequestStatus" class="sub" style="margin-top:6px;"></p>
            <button type="button" id="cancelEditBtn">Cancel</button>
            <button type="submit" class="btn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="profile.js"></script>
</body>
</html>
