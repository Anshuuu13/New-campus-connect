<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusConnect — Team-Up &amp; Project Collaborations | MITS Gwalior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .module-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
  }
  .action-controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    background: #0d1f44;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #1e3a70;
  }
  .search-box-wrap {
    flex: 1 1 240px;
    position: relative;
  }
  .filter-select {
    padding: 10px 14px;
    background: #081329;
    color: #e2e8f0;
    border: 1px solid #1e3a70;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .filter-select:focus {
    border-color: #38bdf8;
  }
  .form-panel-card {
    background: #0d1f44;
    border: 1px solid #2563eb;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .roles-tags-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0;
  }
  .role-tag-pill {
    background: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .status-badge-ongoing {
    background: rgba(16, 185, 129, 0.2);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.4);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .status-badge-pending {
    background: rgba(245, 158, 11, 0.2);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.4);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card-author-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 13px;
    color: #94a3b8;
  }
  .author-avatar-sm {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #1d4ed8;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 12px;
    object-fit: cover;
  }
  .card-actions-toolbar {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .btn-sm {
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
  }
  .btn-edit {
    background: #0284c7;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  .btn-edit:hover {
    background: #0369a1;
  }
  .btn-danger {
    background: #dc2626;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  .btn-danger:hover {
    background: #b91c1c;
  }
  .requests-drawer {
    background: #081329;
    border: 1px solid #1e3a70;
    border-radius: 8px;
    padding: 12px;
    margin-top: 12px;
  }
  .request-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .request-item-row:last-child {
    border-bottom: none;
  }
  .my-requests-banner {
    background: #0d1f44;
    border-left: 4px solid #38bdf8;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="wordmark" style="text-decoration:none; color:inherit;">
      <span class="seal">CC</span>
      <span class="name">CampusConnect</span>
    </a>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="user-chip">
        <span class="dot"></span>
        <span id="userRole">Student</span>
      </div>
      <button id="logoutBtn" class="btn btn-secondary btn-sm" style="display:none;">Sign Out</button>
    </div>
  </header>

  <main class="page">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <div class="rule"></div>

    <div class="module-header">
      <div>
        <h1 style="margin: 0 0 6px 0;">Team-Up &amp; Project Collaborations</h1>
        <p class="sub" style="margin:0;">Connect with MITS peers to form hackathon squads, research teams, and engineering projects.</p>
      </div>
      <button class="btn btn-primary" id="togglePostFormBtn">+ Post New Project</button>
    </div>

    <!-- Collapsible Create Project Form -->
    <div class="form-panel-card" id="createFormCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0; font-size:18px; color:#38bdf8;">Post a Project Seeking Teammates</h3>
        <button id="closeCreateFormBtn" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">&times;</button>
      </div>

      <div style="display:grid; grid-template-columns: 1fr; gap: 14px;">
        <div>
          <label class="field-label" for="teamTitleInput">Project Title *</label>
          <input class="field-input" type="text" id="teamTitleInput" placeholder="e.g. Smart Campus 3D Navigation &amp; AR Map">
        </div>

        <div>
          <label class="field-label" for="teamDescInput">Project Description &amp; Scope *</label>
          <textarea class="field-input" id="teamDescInput" rows="3" placeholder="Briefly describe what you're building, target hackathon/competition, and key objectives..."></textarea>
        </div>

        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:12px;">
          <div>
            <label class="field-label" for="teamRolesInput">Teammates / Roles Needed *</label>
            <input class="field-input" type="text" id="teamRolesInput" placeholder="e.g. 1 Flutter Developer, 1 Three.js student, 1 UI Designer">
          </div>
          <div>
            <label class="field-label" for="teamStatusInput">Project Status</label>
            <select class="field-input" id="teamStatusInput">
              <option value="Ongoing">Ongoing — looking for members</option>
              <option value="Not started yet">Not started yet</option>
            </select>
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
          <button class="btn btn-secondary" id="cancelPostBtn" type="button">Cancel</button>
          <button class="btn btn-primary" id="postTeamBtn" type="button">Publish Project</button>
        </div>
      </div>
    </div>

    <!-- Active User's Sent Join Requests Section -->
    <div id="myRequestsSection" class="my-requests-banner" style="display:none;">
      <h4 style="margin: 0 0 10px 0; color: #38bdf8;">Your Submitted Join Requests</h4>
      <div id="myRequestsList"></div>
    </div>

    <!-- Filter & Search Controls -->
    <div class="action-controls-row">
      <div class="search-box-wrap">
        <input type="text" id="teamSearchInput" class="field-input" placeholder="Search by title, keyword, or role needed..." style="margin:0;">
      </div>
      <div>
        <select id="statusFilterSelect" class="filter-select">
          <option value="All">All Statuses</option>
          <option value="Ongoing">Ongoing</option>
          <option value="Not started yet">Not Started</option>
        </select>
      </div>
      <div id="postsCountBadge" style="font-size:13px; color:#94a3b8; margin-left:auto;">
        Loading projects...
      </div>
    </div>

    <!-- Main Project Feed -->
    <section class="post-list" id="teamList">
      <!-- team posts rendered by team.js -->
    </section>
  </main>

  <!-- Edit Post Modal -->
  <div id="editTeamModal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width:540px; background:#0d1f44; border:1px solid #38bdf8; padding:24px; border-radius:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin:0; font-size:18px; color:#38bdf8;">Edit Project Details</h3>
        <button id="closeEditModalBtn" style="background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <input type="hidden" id="editPostId">
      
      <div style="display:grid; grid-template-columns: 1fr; gap:12px;">
        <div>
          <label class="field-label" for="editTitleInput">Project Title</label>
          <input class="field-input" type="text" id="editTitleInput">
        </div>
        <div>
          <label class="field-label" for="editDescInput">Description</label>
          <textarea class="field-input" id="editDescInput" rows="3"></textarea>
        </div>
        <div>
          <label class="field-label" for="editRolesInput">Roles Needed</label>
          <input class="field-input" type="text" id="editRolesInput">
        </div>
        <div>
          <label class="field-label" for="editStatusInput">Status</label>
          <select class="field-input" id="editStatusInput">
            <option value="Ongoing">Ongoing — looking for members</option>
            <option value="Not started yet">Not started yet</option>
          </select>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
          <button class="btn btn-secondary" id="cancelEditBtn" type="button">Cancel</button>
          <button class="btn btn-primary" id="saveEditBtn" type="button">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="team.js"></script>
</body>
</html>
