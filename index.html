<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusConnect — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="wordmark">
      <span class="seal">CC</span>
      <span class="name">CampusConnect</span>
    </div>
    <div class="user-chip">
    <span class="dot"></span>
    <span id="userRole">Student</span>
    <button id="logoutBtn">Logout</button>
    <a href="editprofile.html">edit profile</a>
</div>
  </header>

  <main class="dashboard">
    <div class="rule"></div>
    <h1 class="name-greeting">Welcome.</h1>
    <p class="sub">Everything happening on campus, in one place.</p>

    <section class="grid" id="cardGrid">
      <!-- cards are rendered by script.js from the data below -->
    </section>
  </main>

  <script src="script.js"></script>
